[project]
name = "netnotepad"
version = "0.1.0.dev0"
description = "A LAN-discoverable shared scratchpad"
requires-python = ">=3.10"
dependencies = [
    "zeroconf>=0.130",
    "regex>=2024.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
netnotepad = "netnotepad.__main__:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netnotepad*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
